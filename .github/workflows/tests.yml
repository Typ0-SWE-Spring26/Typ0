name: Run Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "game/**"
      - "game_screens/**"
      - "server/**"
      - "tests/**"
      - "features/**"
      - "web/**"
      - "main.py"
      - "requirements.txt"
      - "run_tests.py"

jobs:
  web-audio-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web audio unit tests
        run: |
          cd web
          npm ci
          npm test -- audio_manager.test.ts

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python run_tests.py -v

      - name: Run music regression tests
        run: python -m pytest tests/test_menu_music.py tests/test_new_features.py -q

  behave-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run behave tests
        run: python -m behave

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript audio manager
        run: |
          cd web
          npm ci
          npm run build

      - name: Build pygbag bundle
        run: python -m pygbag --build .

      - name: Copy audio assets for JS playback
        run: |
          mkdir -p ./build/web/assets
          cp assets/*.ogg ./build/web/assets/

      - name: Start pygbag server and run browser tests
        run: |
          python -m http.server 8000 --directory build/web &
          sleep 3
          python -m pytest tests/test_browser.py tests/test_browser_features.py tests/test_browser_multiplayer.py tests/test_browser_ws.py -v -m browser
