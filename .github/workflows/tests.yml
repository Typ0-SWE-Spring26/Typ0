name: Run Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "game/**"
      - "game_screens/**"
      - "server/**"
      - "tests/**"
      - "features/**"
      - "web/**"
      - "main.py"
      - "requirements.txt"
      - "run_tests.py"
      - "test_vitals.py"

jobs:
  web-audio-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run web audio unit tests
        run: |
          cd web
          npm ci
          npm test -- audio_manager.test.ts

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python run_tests.py -v

      - name: Run music regression tests
        run: python -m pytest tests/test_menu_music.py tests/test_new_features.py -q

  behave-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run behave tests
        run: python -m behave

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript audio manager
        run: |
          cd web
          npm ci
          npm run build

      - name: Build pygbag bundle
        run: python -m pygbag --build .

      - name: Copy audio assets for JS playback
        run: |
          mkdir -p ./build/web/assets
          cp assets/*.ogg ./build/web/assets/

      - name: Start pygbag server and run browser tests
        run: |
          python -m http.server 8000 --directory build/web &
          sleep 3
          python -m pytest tests/test_browser.py tests/test_browser_features.py tests/test_browser_multiplayer.py tests/test_browser_ws.py -v -m browser

  admin-vitals-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt', 'server/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install server dependencies
        run: |
          pip install -r server/requirements.txt
          pip install requests

      - name: Boot server and probe admin vitals endpoint
        env:
          ADMIN_PASSWORD: ci_test_password_xyz
          PORT: "15090"
        run: |
          mkdir -p /tmp/scores
          # Start the server in the background. STATIC_DIR points at a tmp
          # path so the static catch-all is disabled — we only care about the
          # admin route here.
          SCORES_DIR=/tmp/scores STATIC_DIR=/tmp/no-static \
            python server/server.py > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          # Wait for the port to accept connections (up to ~10s).
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:15090/api/admin/vitals?password=wrong" 2>/dev/null; then
              break
            fi
            # 401 is also "up"; -f makes curl exit non-zero on 401, so check
            # via raw status code too.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:15090/api/admin/vitals?password=wrong" || echo "000")
            if [ "$STATUS" != "000" ]; then
              break
            fi
            sleep 0.5
          done

          FAILED=0

          # Wrong password → 401
          BAD=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:15090/api/admin/vitals?password=wrong")
          if [ "$BAD" = "401" ]; then
            echo "✓ wrong password rejected (HTTP $BAD)"
          else
            echo "✗ wrong password got HTTP $BAD (expected 401)"
            FAILED=1
          fi

          # Missing password → 401
          MISSING=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://127.0.0.1:15090/api/admin/vitals")
          if [ "$MISSING" = "401" ]; then
            echo "✓ missing password rejected (HTTP $MISSING)"
          else
            echo "✗ missing password got HTTP $MISSING (expected 401)"
            FAILED=1
          fi

          # Correct password → 200, and the test_vitals.py script succeeds
          if python test_vitals.py "$ADMIN_PASSWORD"; then
            echo "✓ test_vitals.py passed"
          else
            echo "✗ test_vitals.py failed"
            FAILED=1
          fi

          kill $SERVER_PID 2>/dev/null || true

          if [ "$FAILED" -ne 0 ]; then
            echo "--- server.log ---"
            cat /tmp/server.log
            exit 1
          fi
