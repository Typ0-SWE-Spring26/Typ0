name: Deploy Pygame to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygbag
          grep -v pygame-ce requirements.txt | pip install -r /dev/stdin

      - name: Build with pygbag
        run: |
          python -m pygbag --build --ume_block 0 .

      - name: Patch ume_block in generated index.html
        run: |
          sed -i 's/ume_block : 1/ume_block : 0/' ./build/web/index.html
          if grep -q 'ume_block : 1' ./build/web/index.html; then
            echo "ERROR: ume_block patch verification failed; stale value still present."
            exit 1
          fi
          if ! grep -q 'ume_block : 0' ./build/web/index.html; then
            echo "ERROR: ume_block patch verification failed; expected value not found."
            exit 1
          fi

      - name: Download pygame-ce wheel
        run: |
          mkdir -p ./build/web/cdn/cp312
          curl -L "https://pygame-web.github.io/cdn/cp312/pygame_ce-2.5.7-cp312-cp312-wasm32_bi_emscripten.whl" \
            -o "./build/web/cdn/cp312/pygame_ce-2.5.7-cp312-cp312-wasm32_bi_emscripten.whl"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./build/web/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/typo/deploy/

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "screen -ls typ0 | grep -o '[0-9]*\.typ0' | xargs -I{} screen -S {} -X quit; sleep 1; screen -dmS typ0 bash -c 'cd /home/typo/deploy && python3 -m http.server 15090'"
