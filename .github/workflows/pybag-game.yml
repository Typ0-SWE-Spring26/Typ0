name: Deploy Pygame to Server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pygbag
          grep -v pygame-ce requirements.txt | pip install -r /dev/stdin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build TypeScript audio manager
        run: |
          cd web
          npm ci
          npm run build

      - name: Build with pygbag
        run: |
          python -m pygbag --build --ume_block 0 .

      - name: Copy audio assets and JS audio manager for web
        run: |
          mkdir -p ./build/web/assets
          cp assets/*.ogg ./build/web/assets/
          cp assets/audio_manager.js ./build/web/audio_manager.js

      - name: Patch index.html (ume_block + inject audio manager script)
        run: |
          sed -i 's/ume_block : 1/ume_block : 0/' ./build/web/index.html
          sed -i 's|</head>|<script src="audio_manager.js"></script>\n</head>|' ./build/web/index.html
          if grep -q 'ume_block : 1' ./build/web/index.html; then
            echo "ERROR: ume_block patch failed — stale value still present."
            exit 1
          fi
          if ! grep -q 'ume_block : 0' ./build/web/index.html; then
            echo "ERROR: ume_block patch failed — expected value not found."
            exit 1
          fi
          if ! grep -q 'audio_manager.js' ./build/web/index.html; then
            echo "ERROR: audio manager script tag not injected into index.html."
            exit 1
          fi

      - name: Download pygame-ce wheel
        run: |
          mkdir -p ./build/web/cdn/cp312
          curl -L "https://pygame-web.github.io/cdn/cp312/pygame_ce-2.5.7-cp312-cp312-wasm32_bi_emscripten.whl" \
            -o "./build/web/cdn/cp312/pygame_ce-2.5.7-cp312-cp312-wasm32_bi_emscripten.whl"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy game files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./build/web/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/typo/deploy/

      - name: Deploy multiplayer server
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./server/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/typo/server/

      - name: Restart servers
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e

          mkdir -p /home/typo/logs

          python3 -m pip install -q -r /home/typo/server/requirements.txt

          mkdir -p /home/typo/scores

          # Stop existing screen sessions if running
          screen -S typ0    -X quit 2>/dev/null || true
          screen -S typ0-ws -X quit 2>/dev/null || true
          sleep 1

          # Game HTTP server on port 15090
          screen -dmS typ0 bash -c \
            'cd /home/typo/deploy && python3 -m http.server 15090 >> /home/typo/logs/http.log 2>&1'

          # Multiplayer WebSocket server (14023) + Score API (14024)
          screen -dmS typ0-ws bash -c \
            'cd /home/typo/server && SCORES_DIR=/home/typo/scores python3 server.py >> /home/typo/logs/ws.log 2>&1'

          echo "Servers started."
          EOF

      - name: Health check
        run: |
          echo "Waiting for servers to come up..."
          sleep 6

          FAILED=0

          # Game HTTP server
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "http://${{ secrets.SSH_HOST }}:15090/index.html")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ Game server       :15090  →  HTTP $HTTP_STATUS"
          else
            echo "✗ Game server       :15090  →  HTTP $HTTP_STATUS (expected 200)"
            FAILED=1
          fi

          # WebSocket server (TCP port check)
          if timeout 10 bash -c "</dev/tcp/${{ secrets.SSH_HOST }}/14023" 2>/dev/null; then
            echo "✓ WebSocket server  :14023  →  port open"
          else
            echo "✗ WebSocket server  :14023  →  port not reachable"
            FAILED=1
          fi

          # Score API (HTTP check)
          SCORE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "http://${{ secrets.SSH_HOST }}:14024/scores/simon")
          if [ "$SCORE_STATUS" = "200" ]; then
            echo "✓ Score API         :14024  →  HTTP $SCORE_STATUS"
          else
            echo "✗ Score API         :14024  →  HTTP $SCORE_STATUS (expected 200)"
            FAILED=1
          fi

          [ "$FAILED" -eq 0 ] && echo "All health checks passed." || exit 1
